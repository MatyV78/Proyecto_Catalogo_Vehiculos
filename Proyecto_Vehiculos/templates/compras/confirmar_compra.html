<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f6f7fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { max-width: 460px; width: 100%; border: none; box-shadow: 0 6px 18px rgba(0,0,0,0.12); border-radius: 16px; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">Confirmar compra</h4>
    </div>
    <div class="card-body">
        <p class="mb-1 text-muted text-uppercase small">Vehículo {{ tipo }}</p>
        <h5 class="fw-bold mb-2">{{ vehiculo.marca }} {{ vehiculo.modelo }}</h5>
        <p class="mb-2">Año: {{ vehiculo.año|default:vehiculo.año }}</p>
        <p class="mb-2">Tipo: {{ vehiculo.tipo_vehiculo }}</p>
        <p class="mb-3 fs-5">Precio: <strong>{{ vehiculo.Precio }}</strong></p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-success w-100">Confirmar compra</button>
        </form>
        <a href="javascript:history.back()" class="btn btn-link w-100 mt-3">Volver</a>
    </div>
</div>
</body>
</html>
