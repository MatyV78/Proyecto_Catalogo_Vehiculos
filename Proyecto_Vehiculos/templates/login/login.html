<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Motores del Sur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { background: linear-gradient(135deg, #1a1a1a, #3b3b3b); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background-color: #222; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(255, 0, 0, 0.3); width: 100%; max-width: 420px; }
        .login-container h1 { text-align: center; margin-bottom: 30px; color: #ff2e2e; }
        .btn-login { background-color: #ff2e2e; border: none; width: 100%; padding: 10px; font-weight: bold; }
        .btn-login:hover { background-color: #e00000; }
        a { color: #ff2e2e; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error-message { color: #ff5b5b; text-align: center; margin-top: 10px; }
        .form-label { color: #fff; }
        .form-control { background: #111; color: #fff; border: 1px solid #444; }
        .form-control:focus { background: #111; color: #fff; border-color: #ff2e2e; box-shadow: none; }
    </style>
</head>
<body>
<div class="login-container">
    <h1>Iniciar Sesión</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="error-message">{{ form.non_field_errors }}</div>
        {% endif %}
        <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
            {{ form.username.errors }}
        </div>
        <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}
            {{ form.password.errors }}
        </div>
        <button type="submit" class="btn btn-login mt-2">Entrar</button>
    </form>
    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}
    <p class="mt-3 text-center">¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate aquí</a>.</p>
</div>
</body>
</html>
